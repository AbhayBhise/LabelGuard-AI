name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile application code
        run: python -m compileall -q app
      - name: Run backend tests
        env:
          DATABASE_URL: sqlite:///./ci.db
          DEBUG: "false"
          JWT_SECRET: ci-only-secret-not-for-production
          MINIO_ENDPOINT: localhost:9000
        run: python -m unittest discover -s tests -v

  web:
    name: Web checks (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Build production application
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid/v1
        run: npm run build

  containers:
    name: Container configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build API image
        run: docker build --tag labelguard-api:ci ./backend
