# Render Blueprint for LabelGuard AI.
# Create it in Render with New > Blueprint and select this repository.
services:
  - type: web
    name: labelguard-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    # Free Render services do not support preDeployCommand. Run migrations
    # before starting this single API instance instead.
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: labelguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: labelguard-cache
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://labelguard-web.onrender.com
      # Local storage is used unless these S3-compatible storage values are set.
      - key: MINIO_ENDPOINT
        value: localhost:9000
      - key: MINIO_SECURE
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: web
    name: labelguard-web
    runtime: node
    region: singapore
    plan: free
    rootDir: ./web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # This is baked into the browser bundle during the web build.
      - key: NEXT_PUBLIC_API_URL
        value: https://labelguard-api.onrender.com/v1

  - type: keyvalue
    name: labelguard-cache
    region: singapore
    plan: free
    ipAllowList: []

databases:
  - name: labelguard-db
    region: singapore
    plan: free
    databaseName: labelguard
    user: labelguard
